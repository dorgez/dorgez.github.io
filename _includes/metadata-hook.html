<!-- Person structured data for the site owner.
     Emitted only on the home and About pages: posts already carry their own
     BlogPosting schema from jekyll-seo-tag, and one Person entity per site
     is what search engines expect. -->

{%- if page.url == '/' or page.url == '/about-me/' -%}
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": {{ site.social.name | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "image": {{ site.avatar | absolute_url | jsonify }},
      "jobTitle": "Hydrologist and Data Scientist",
      "description": {{ site.description | strip_newlines | strip | jsonify }},
      "sameAs": [
        {%- for link in site.social.links -%}
          {{ link | jsonify }}{% unless forloop.last %},{% endunless %}
        {%- endfor -%}
      ]
    }
  </script>
{%- endif -%}
